name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      request_signing:
        description: Request approved SignPath production signing (main only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-linux.txt PySide6-Essentials==6.8.3 cryptography==50.0.2
      - name: Test game, Qt screens and real TLS
        run: python app.py --release-self-test dist/reports/linux-tests.json
      - name: Upload Linux test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-validation-${{ github.run_id }}
          path: dist/reports/
          if-no-files-found: warn
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Validate signing configuration
        if: inputs.request_signing
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_SLUG: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Sign only reviewed main builds.' }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_POLICY_SLUG','SIGNPATH_ARTIFACT_SLUG','SIGNPATH_API_TOKEN')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name; complete approved SignPath onboarding first." }
          }
      - name: Build and test from source
        run: ./build.ps1
      - name: Read version
        id: version
        run: |
          $version = & ./.build-env/Scripts/python.exe -c 'from game import VERSION; print(VERSION)'
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Upload full unsigned game for origin verification
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DopeWars-BFT-unsigned-${{ github.run_id }}
          path: dist/DopeWars-BFT/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Submit to SignPath and wait for maintainer approval
        if: inputs.request_signing
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-game
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}
      - name: Verify signed output and create portable ZIP
        if: inputs.request_signing
        run: |
          ./ci/verify-signed.ps1 -UnsignedDirectory dist/DopeWars-BFT -SignedDirectory dist/signed-game
          & ./.build-env/Scripts/python.exe ci/package_portable.py archive --input dist/signed-game --label signed
          if ($LASTEXITCODE -ne 0) { throw 'Signed package failed.' }
      - name: Upload verified signed package
        if: inputs.request_signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DopeWars-BFT-signed-${{ github.run_id }}
          path: |
            dist/*-signed.zip
            dist/*-signed.sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.run_id }}
          path: dist/reports/
          if-no-files-found: warn
